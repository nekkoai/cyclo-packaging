name: Build latest Cyclo Debian packages

on:
  workflow_dispatch:
    inputs:
      cyclo_agent_branch:
        description: Cyclo branch to package
        required: true
        default: main
        type: string
      dcomp_branch:
        description: DComp branch to package
        required: true
        default: main
        type: string
      provider_pooler_branch:
        description: Provider-pooler branch to package
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and publish Debian artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            debhelper dh-python golang-go python3-all python3-build \
            python3-installer python3-setuptools python3-wheel

      - name: Resolve requested upstream branch tips
        env:
          CYCLO_AGENT_BRANCH: ${{ inputs.cyclo_agent_branch }}
          DCOMP_BRANCH: ${{ inputs.dcomp_branch }}
          PROVIDER_POOLER_BRANCH: ${{ inputs.provider_pooler_branch }}
        run: |
          ./tools/refresh-latest \
            --ref "cyclo-agent=$CYCLO_AGENT_BRANCH" \
            --ref "dcomp=$DCOMP_BRANCH" \
            --ref "cyclo-provider-pooler=$PROVIDER_POOLER_BRANCH"

      - name: Validate packaging repository
        run: make test

      - name: Build the package suite
        run: ./tools/build-packages --output artifacts

      - name: Capture resolved source lock
        run: |
          cp sources.lock.json artifacts/sources.lock.json
          git diff -- packages > artifacts/packaging-version-updates.patch
          find artifacts -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > artifacts/SHA256SUMS

      - name: Publish Debian packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cyclo-debian-packages-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
